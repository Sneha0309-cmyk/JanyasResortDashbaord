<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resort Owner Login - Janyas Homestay</title>
  <link rel="icon" href="/assets/janyas-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --forest: #1f4d2e;
      --forest-deep: #183d24;
      --forest-soft: #2f5e3d;
      --gold: #c8a45a;
      --gold-light: #e3c982;
      --gold-glow: rgba(200, 164, 90, 0.35);
      --cream: rgba(251, 246, 234, 0.90);
      --cream-solid: #fbf6ea;
      --ivory: #fffdf7;
      --text: #23422d;
      --muted: #5f7263;
      --input-bg: rgba(255, 251, 243, 0.82);
      --error: #b94a48;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; }
    body {
      font-family: "Nunito Sans", "Segoe UI", sans-serif;
      background: url('/assets/janyas.png') center center / cover no-repeat fixed;
      color: var(--text);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(90deg, rgba(20,35,24,0.08) 0%, rgba(20,35,24,0.02) 35%, rgba(20,35,24,0.10) 100%);
      pointer-events: none;
    }
    .page {
      position: relative;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: clamp(12px, 2vh, 24px) 4vw;
      overflow: hidden;
    }
    .login-card {
      position: relative;
      width: min(28vw, 560px);
      max-height: calc(100vh - clamp(24px, 4vh, 48px));
      height: auto;
      background: linear-gradient(180deg, rgba(255,252,246,0.92) 0%, var(--cream) 45%, rgba(248,241,225,0.92) 100%);
      border: 1px solid rgba(200, 164, 90, 0.85);
      border-radius: 30px;
      box-shadow: 0 0 0 1px rgba(255, 235, 190, 0.45), 0 0 28px var(--gold-glow), 0 24px 60px rgba(28, 40, 28, 0.22);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: clamp(18px, 2.4vh, 30px) clamp(24px, 2.4vw, 44px) 0;
    }
    .login-card::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 26px;
      border: 1px solid rgba(200, 164, 90, 0.18);
      pointer-events: none;
    }
    .card-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: clamp(4px, 0.8vh, 10px);
    }
    .logo-circle {
      width: clamp(44px, 5.5vh, 60px);
      height: clamp(44px, 5.5vh, 60px);
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(227,201,130,0.12));
      border: 1px solid rgba(200,164,90,0.45);
      display: grid;
      place-items: center;
      color: var(--forest);
      box-shadow: 0 6px 18px rgba(31,77,46,0.08);
    }
    .logo-circle svg { width: clamp(24px, 3.2vh, 34px); height: clamp(24px, 3.2vh, 34px); display: block; }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(28px, 4.2vh, 48px);
      line-height: 1.05;
      font-weight: 700;
      color: var(--forest-deep);
      text-align: center;
      letter-spacing: 0.01em;
      margin-bottom: clamp(6px, 1vh, 12px);
    }
    .divider {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 clamp(6px, 0.8vh, 12px);
      color: var(--gold);
    }
    .divider .line {
      flex: 1;
      max-width: 110px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(200,164,90,0.25), rgba(200,164,90,0.95), rgba(200,164,90,0.25), transparent);
    }
    .divider svg { width: 20px; height: 20px; flex: 0 0 auto; display: block; }
    .subtitle {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(17px, 2.2vh, 26px);
      font-style: italic;
      font-weight: 500;
      color: #2d5a39;
      text-align: center;
      margin-bottom: clamp(12px, 2vh, 24px);
    }
    .field { margin-bottom: clamp(10px, 1.5vh, 18px); }
    .input-shell {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-shell input {
      width: 100%;
      height: clamp(44px, 5.8vh, 56px);
      border-radius: 14px;
      border: 1px solid rgba(200,164,90,0.28);
      background: var(--input-bg);
      padding: 0 48px 0 50px;
      font-size: 15px;
      color: var(--text);
      font-family: "Nunito Sans", sans-serif;
      outline: none;
      transition: border-color .25s ease, box-shadow .25s ease, background .25s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .input-shell input::placeholder { color: #7a877c; }
    .input-shell input:focus {
      border-color: rgba(200,164,90,0.75);
      box-shadow: 0 0 0 4px rgba(200,164,90,0.14), inset 0 1px 0 rgba(255,255,255,0.9);
      background: rgba(255,253,248,0.96);
    }
    .field-icon {
      position: absolute;
      left: 18px;
      width: 22px;
      height: 22px;
      color: var(--forest-soft);
      pointer-events: none;
    }
    .toggle-password {
      position: absolute;
      right: 14px;
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #55705a;
      border-radius: 10px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
    }
    .toggle-password:hover { background: rgba(31,77,46,0.06); color: var(--forest); }
    .toggle-password:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    .toggle-password svg, .field-icon svg { width: 22px; height: 22px; display: block; }
    .login-btn {
      width: 100%;
      height: clamp(44px, 5.8vh, 56px);
      margin-top: 4px;
      border-radius: 14px;
      border: 1px solid rgba(200,164,90,0.95);
      background: linear-gradient(180deg, #285a36 0%, var(--forest) 55%, var(--forest-deep) 100%);
      color: #fff;
      font-family: "Nunito Sans", sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(31,77,46,0.28), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform .18s ease, box-shadow .25s ease, filter .25s ease;
    }
    .login-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.03);
      box-shadow: 0 14px 28px rgba(31,77,46,0.34), 0 0 0 3px rgba(200,164,90,0.12);
    }
    .login-btn:active { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.72; cursor: wait; transform: none; }
    .login-btn svg { width: 20px; height: 20px; display: block; }
    .msg {
      min-height: 20px;
      margin-top: 8px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.3;
    }
    .msg.error { color: var(--error); }
    .msg.ok { color: var(--forest); }
    .welcome-wrap {
      margin-top: auto;
      padding: clamp(4px, 0.8vh, 10px) 0 2px;
      text-align: center;
    }
    .welcome {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(24px, 3.4vh, 38px);
      font-style: italic;
      font-weight: 600;
      color: #2a5a38;
      margin: 4px 0;
      line-height: 1;
    }
    .card-bottom {
      position: relative;
      margin: 0 calc(clamp(24px, 2.4vw, 44px) * -1);
      height: clamp(88px, 12vh, 130px);
      min-height: 88px;
      pointer-events: none;
    }
    .bottom-lotus {
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      width: 34px;
      height: 34px;
      color: var(--gold);
      z-index: 3;
      filter: drop-shadow(0 2px 4px rgba(200,164,90,0.25));
    }
    .landscape {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .sr-only {
      position: absolute !important;
      width: 1px; height: 1px;
      padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0);
      white-space: nowrap; border: 0;
    }
    @media (max-width: 1200px) {
      .login-card { width: min(42vw, 520px); }
    }
    @media (max-width: 980px) {
      body { background-attachment: scroll; }
      .page { justify-content: center; padding: 16px; }
      .login-card {
        width: min(94vw, 560px);
        max-height: calc(100vh - 32px);
      }
    }
    @media (max-width: 640px) {
      .page { padding: 10px; align-items: center; }
      .login-card {
        width: 100%;
        max-height: calc(100vh - 20px);
        border-radius: 24px;
        padding: 16px 18px 0;
      }
      .card-bottom { margin: 0 -18px; height: clamp(72px, 11vh, 110px); min-height: 72px; }
      h1 { font-size: clamp(28px, 5vw, 36px); }
      .subtitle { font-size: clamp(16px, 3.8vw, 22px); margin-bottom: 10px; }
      .input-shell input, .login-btn { height: 46px; font-size: 15px; }
      .welcome { font-size: clamp(24px, 5vw, 32px); }
      .msg { font-size: 12px; min-height: 18px; margin-top: 6px; }
    }
    @media (max-height: 760px) {
      .login-card { max-height: calc(100vh - 20px); }
      .logo-circle { width: 44px; height: 44px; }
      .logo-circle svg { width: 24px; height: 24px; }
      h1 { font-size: clamp(26px, 4.8vh, 38px); margin-bottom: 4px; }
      .subtitle { margin-bottom: 10px; font-size: clamp(16px, 2.4vh, 22px); }
      .field { margin-bottom: 8px; }
      .input-shell input, .login-btn { height: 44px; }
      .card-bottom { height: clamp(70px, 11vh, 100px); min-height: 70px; }
      .welcome-wrap { padding-top: 2px; }
      .welcome { font-size: clamp(22px, 3.8vh, 32px); }
      .msg { margin-top: 4px; min-height: 16px; font-size: 12px; }
    }
    @media (max-height: 680px) {
      .divider { margin-bottom: 4px; gap: 8px; }
      .divider svg { width: 16px; height: 16px; }
      .bottom-lotus { width: 26px; height: 26px; top: 4px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="login-card" aria-labelledby="loginTitle">
      <div class="card-content">
        <div class="logo-wrap" aria-hidden="true">
          <div class="logo-circle">
            <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 46L27 24l8 11 5-7 12 18"/>
              <path d="M8 50h48"/>
              <path d="M27 24l4 6"/>
              <path d="M40 28l3 4"/>
            </svg>
          </div>
        </div>

        <h1 id="loginTitle">Resort Owner Login</h1>

        <div class="divider" aria-hidden="true">
          <span class="line"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21c0-4.2 2.8-7.2 7-8-1.2 4.5-3.7 7-7 8Z"/>
            <path d="M12 21c0-4.2-2.8-7.2-7-8 1.2 4.5 3.7 7 7 8Z"/>
            <path d="M12 21V11"/>
            <path d="M12 11c1.8-1.8 2.7-3.4 2.7-5.2C14.7 4 13.5 2.7 12 1.8 10.5 2.7 9.3 4 9.3 5.8c0 1.8.9 3.4 2.7 5.2Z"/>
            <path d="M7.2 10.2c1.8.2 3.2.8 4.3 1.8-2 .2-3.7-.3-5.1-1.6.2-.1.5-.2.8-.2Z"/>
            <path d="M16.8 10.2c-1.8.2-3.2.8-4.3 1.8 2 .2 3.7-.3 5.1-1.6-.2-.1-.5-.2-.8-.2Z"/>
          </svg>
          <span class="line"></span>
        </div>

        <p class="subtitle">Manage your Resort with Ease</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label class="sr-only" for="username">Username</label>
            <div class="input-shell">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21a8 8 0 0 0-16 0"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input id="username" name="username" type="text" autocomplete="username" maxlength="100" placeholder="Username" required>
            </div>
          </div>

          <div class="field">
            <label class="sr-only" for="password">Password</label>
            <div class="input-shell">
              <span class="field-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="5" y="11" width="14" height="10" rx="2.2"/>
                  <path d="M8 11V8a4 4 0 1 1 8 0v3"/>
                  <circle cx="12" cy="16" r="1.2" fill="currentColor" stroke="none"/>
                </svg>
              </span>
              <input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" placeholder="Password" required>
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password" aria-pressed="false" title="Show password">
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path>
                  <circle cx="12" cy="12" r="2.8"></circle>
                </svg>
              </button>
            </div>
          </div>

          <button id="submitBtn" class="login-btn" type="submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <path d="M10 17l5-5-5-5"/>
              <path d="M15 12H3"/>
            </svg>
            <span>Login</span>
          </button>
          <div id="msg" class="msg" role="status" aria-live="polite"></div>
        </form>

        <div class="welcome-wrap">
          <div class="divider" aria-hidden="true">
            <span class="line"></span>
            <span class="line"></span>
          </div>
          <p class="welcome">Welcome Back!</p>
        </div>
      </div>

      <div class="card-bottom" aria-hidden="true">
        <svg class="bottom-lotus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21c0-4.2 2.8-7.2 7-8-1.2 4.5-3.7 7-7 8Z"/>
          <path d="M12 21c0-4.2-2.8-7.2-7-8 1.2 4.5 3.7 7 7 8Z"/>
          <path d="M12 21V11"/>
          <path d="M12 11c1.8-1.8 2.7-3.4 2.7-5.2C14.7 4 13.5 2.7 12 1.8 10.5 2.7 9.3 4 9.3 5.8c0 1.8.9 3.4 2.7 5.2Z"/>
        </svg>
        <svg class="landscape" viewBox="0 0 800 220" preserveAspectRatio="none">
          <defs>
            <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="rgba(251,246,234,0)"/>
              <stop offset="100%" stop-color="rgba(232,225,205,0.55)"/>
            </linearGradient>
            <linearGradient id="hill1" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#8fa88f"/>
              <stop offset="100%" stop-color="#6f8870"/>
            </linearGradient>
            <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#6e876d"/>
              <stop offset="100%" stop-color="#516a54"/>
            </linearGradient>
            <linearGradient id="hill3" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#56705a"/>
              <stop offset="100%" stop-color="#3f5944"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="800" height="220" fill="url(#mist)"/>
          <path d="M0 155 C70 130, 120 128, 180 142 C250 120, 290 120, 360 140 C430 118, 490 120, 560 140 C640 122, 700 128, 800 150 L800 220 L0 220 Z" fill="url(#hill1)" opacity="0.9"/>
          <path d="M0 175 C60 160, 120 150, 170 160 C240 138, 310 138, 380 160 C450 142, 520 144, 590 162 C660 148, 720 150, 800 168 L800 220 L0 220 Z" fill="url(#hill2)" opacity="0.95"/>
          <path d="M0 220 L0 188 C50 182, 90 176, 140 182 C200 168, 250 168, 310 184 C360 172, 420 170, 470 182 C540 168, 610 170, 670 184 C720 178, 760 180, 800 190 L800 220 Z" fill="url(#hill3)"/>
          <g fill="none" stroke="#435d47" stroke-width="2.2" stroke-linecap="round" opacity="0.9">
            <path d="M68 188 l0 -18 m0 7 l-7 -6 m7 6 l7 -6 m-7 6 l-5 6 m5 -6 l5 6"/>
            <path d="M112 184 l0 -22 m0 8 l-8 -7 m8 7 l8 -7 m-8 7 l-6 7 m6 -7 l6 7"/>
            <path d="M640 186 l0 -20 m0 8 l-8 -7 m8 7 l8 -7 m-8 7 l-6 7 m6 -7 l6 7"/>
            <path d="M690 190 l0 -16 m0 6 l-6 -5 m6 5 l6 -5 m-6 5 l-5 5 m5 -5 l5 5"/>
          </g>
        </svg>
      </div>
    </main>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      togglePassword.setAttribute('aria-pressed', String(isHidden));
      togglePassword.title = isHidden ? 'Hide password' : 'Show password';
      eyeIcon.innerHTML = isHidden
        ? '<path d="M3 3l18 18"></path><path d="M10.58 10.58a2.5 2.5 0 0 0 3.54 3.54"></path><path d="M9.88 5.09A10.94 10.94 0 0 1 12 4c6.5 0 10 8 10 8a15.32 15.32 0 0 1-4.12 4.88M6.61 6.61C3.62 8.63 2 12 2 12s3.5 8 10 8a10.9 10.9 0 0 0 5.39-1.39"></path>'
        : '<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6Z"></path><circle cx="12" cy="12" r="2.8"></circle>';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;
      if (!username || !password) {
        msg.className = 'msg error';
        msg.textContent = 'Please enter your username and password.';
        return;
      }
      btn.disabled = true;
      const original = btn.innerHTML;
      btn.innerHTML = '<span>Logging in...</span>';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ username, password })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Login failed.');
        }
        msg.className = 'msg ok';
        msg.textContent = 'Login successful. Redirecting...';
        window.location.href = '/';
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = err.message || 'Login failed.';
      } finally {
        btn.disabled = false;
        btn.innerHTML = original;
      }
    });
  </script>
</body>
</html>
